# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: KM Web CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: km-web-production
  cancel-in-progress: true

jobs:

  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  deploy:
    name: Deploy to Production
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.PROD_SSH_PORT }}

          script: |
            set -e

            echo "======================================"
            echo "KM PRODUCTION DEPLOYMENT"
            echo "======================================"

            echo "Connected as:"
            whoami

            echo "Server:"
            hostname


            # -----------------------------------------------
            # PROJECT DIRECTORY
            # -----------------------------------------------

            cd "${{ secrets.PROD_PATH }}"

            echo "Project path:"
            pwd


            # -----------------------------------------------
            # GET LATEST CODE
            # -----------------------------------------------

            echo "Fetching latest code..."

            git fetch origin main
            git reset --hard origin/main

            echo "Current commit:"
            git log -1 --oneline


            # -----------------------------------------------
            # BACKEND
            # -----------------------------------------------

            echo "Installing backend dependencies..."

            cd backend

            npm ci --omit=dev


            # -----------------------------------------------
            # FRONTEND
            # -----------------------------------------------

            echo "Installing frontend dependencies..."

            cd ../frontend

            npm ci

            echo "Building frontend..."

            npm run build


            # -----------------------------------------------
            # PUBLISH FRONTEND
            # -----------------------------------------------

            echo "Publishing frontend..."

            rsync -av --delete \
              dist/ \
              "${{ secrets.PROD_WEB_ROOT }}/"


            # -----------------------------------------------
            # RESTART BACKEND
            # -----------------------------------------------

            echo "Restarting backend..."

            cd ../backend

            if pm2 describe km-web > /dev/null 2>&1; then

              pm2 reload km-web --update-env

            else

              pm2 start npm \
                --name "km-web" \
                -- start

            fi


            pm2 save


            # -----------------------------------------------
            # STATUS
            # -----------------------------------------------

            pm2 status

            echo "======================================"
            echo "KM DEPLOYMENT SUCCESSFUL"
            echo "======================================"
